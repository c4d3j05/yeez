name: build

# Build the Docker image (pushed to GHCR) and native macOS binaries.
# On a version tag (v*) the macOS binaries are also attached to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # create releases / upload assets on tags
  packages: write # push images to GHCR

jobs:
  # -------------------------------------------------------------------------
  # Docker image -> ghcr.io/<owner>/yeez
  # -------------------------------------------------------------------------
  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Skip the login/push on pull requests (no credentials for forks).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the Actions cache. Note: the first build and any
          # build that changes yeez.cabal still recompiles the (large)
          # amazonka dependency tree.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # Native macOS binaries (Apple Silicon + Intel)
  # -------------------------------------------------------------------------
  macos-binary:
    name: macOS binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            arch: arm64
          - runner: macos-13 # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC and Cabal
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: '3.10.3.0'

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.arch }}-ghc9.4.8-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-ghc9.4.8-

      - name: Build
        run: |
          cabal update
          cabal build exe:yeez

      - name: Stage binary
        run: |
          mkdir -p dist
          cp "$(cabal list-bin exe:yeez)" "dist/yeez-macos-${{ matrix.arch }}"
          strip "dist/yeez-macos-${{ matrix.arch }}" || true
          file "dist/yeez-macos-${{ matrix.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yeez-macos-${{ matrix.arch }}
          path: dist/yeez-macos-${{ matrix.arch }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/yeez-macos-${{ matrix.arch }}
