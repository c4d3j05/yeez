name: build

# Continuous integration only: build and validate on every push to main and
# on pull requests. Nothing is published here — no GHCR image, no GitHub
# Release, no Homebrew bump. All packaging happens in the `release` workflow
# (Actions ▸ release ▸ Run workflow), which owns the Docker image, the macOS
# binary, the GitHub Release and the formula bump for a version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Docker image builds (validation only — never pushed).
  # -------------------------------------------------------------------------
  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: yeez:ci
          # Layer cache in the Actions cache. Note: the first build and any
          # build that changes yeez.cabal still recompiles the (large)
          # amazonka dependency tree.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # Native macOS binary (Apple Silicon) — uploaded as a CI artifact only.
  # -------------------------------------------------------------------------
  macos-binary:
    name: macOS binary (arm64)
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC and Cabal
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.8'
          cabal-version: '3.10.3.0'

      - name: Cache Cabal store
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-arm64-ghc9.4.8-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-arm64-ghc9.4.8-

      - name: Build
        run: |
          cabal update
          cabal build exe:yeez

      - name: Stage binary
        run: |
          mkdir -p dist
          cp "$(cabal list-bin exe:yeez)" dist/yeez-macos-arm64
          strip dist/yeez-macos-arm64 || true
          file dist/yeez-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yeez-macos-arm64
          path: dist/yeez-macos-arm64
